# Least privilege for everything Argo CD deploys for Pulsewatch: one repo, the
# pulsewatch* namespaces, and only the cluster-scoped kinds the overlays contain.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pulsewatch
spec:
  description: Pulsewatch probe regions and monitoring
  sourceRepos:
    - https://github.com/gigaflippy/pulsewatch.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: pulsewatch*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
