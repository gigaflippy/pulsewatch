# Argo CD itself, pinned to a release. Apply server-side (the CRDs are too big for
# client-side apply's last-applied annotation):
#   kubectl apply --server-side --force-conflicts -k deploy/argocd/install
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.12/manifests/install.yaml

patches:
  # Plain HTTP behind `kubectl port-forward`: no self-signed certificate warning locally.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
  # Poll Git every 60s instead of ~3m, so a merged change shows up quickly on a laptop.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        timeout.reconciliation: 60s
  # No SSO locally (admin login only), so Dex isn't needed.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
      spec:
        replicas: 0
  # Redis comes from public.ecr.aws, which rate-limits ("toomanyrequests: Data limit
  # exceeded"). Upstream sets imagePullPolicy: Always, so even a side-loaded image is
  # re-checked against the registry and the pod sits in ImagePullBackOff. Use the copy
  # already on the node when there is one (CI pre-pulls it; see the argocd job).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                imagePullPolicy: IfNotPresent
