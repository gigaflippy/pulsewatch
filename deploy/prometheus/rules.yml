groups:
  - name: pulsewatch.recording
    rules:
      - record: pulsewatch:uptime_ratio_1h
        expr: avg_over_time(pulsewatch_up[1h])
      - record: pulsewatch:latency_p95_seconds
        expr: |
          histogram_quantile(0.95,
            sum by (le, target, region) (rate(pulsewatch_probe_latency_seconds_bucket[5m])))

  # Availability SLO per target, with error-budget burn-rate alerts (Google SRE workbook,
  # ch. 5 "Alerting on SLOs": multiwindow, multi-burn-rate).
  #
  # SLI: the fraction of time the target is up from at least one region. This is the same
  # consensus rule TargetDown uses, so one bad probe location burns no budget and can't page.
  # SLO window: 7 days (Prometheus keeps 8d, so the 7d window always has full data). Objective: slo_objective in targets.yaml
  # (default 0.995), exported by every agent as pulsewatch_slo_objective.
  - name: pulsewatch.slo
    rules:
      - record: pulsewatch:target_up
        expr: max by (target) (pulsewatch_up)
      - record: pulsewatch:slo_objective
        expr: max by (target) (pulsewatch_slo_objective)
      - record: pulsewatch:slo_error_ratio:5m
        expr: 1 - avg_over_time(pulsewatch:target_up[5m])
      - record: pulsewatch:slo_error_ratio:30m
        expr: 1 - avg_over_time(pulsewatch:target_up[30m])
      - record: pulsewatch:slo_error_ratio:1h
        expr: 1 - avg_over_time(pulsewatch:target_up[1h])
      - record: pulsewatch:slo_error_ratio:6h
        expr: 1 - avg_over_time(pulsewatch:target_up[6h])
      - record: pulsewatch:slo_error_ratio:3d
        expr: 1 - avg_over_time(pulsewatch:target_up[3d])
      - record: pulsewatch:slo_error_ratio:7d
        expr: 1 - avg_over_time(pulsewatch:target_up[7d])
      # Burn rate 1 = spending the budget exactly over the 7d window; 14.4 = in ~12h.
      - record: pulsewatch:slo_burn_rate:1h
        expr: pulsewatch:slo_error_ratio:1h / (1 - pulsewatch:slo_objective)
      - record: pulsewatch:slo_burn_rate:6h
        expr: pulsewatch:slo_error_ratio:6h / (1 - pulsewatch:slo_objective)
      # 1 = untouched, 0 = spent, negative = SLO missed over the last 7d.
      - record: pulsewatch:slo_error_budget_remaining:7d
        expr: 1 - pulsewatch:slo_error_ratio:7d / (1 - pulsewatch:slo_objective)

  - name: pulsewatch.alerts
    rules:
      # A target is only paged as down when every region that probes it agrees.
      # With a single region this is the same as "down from that region".
      - alert: TargetDown
        expr: max by (target) (pulsewatch_up) == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.target }} is down from every region"
      # Down from some regions but up from others: a regional or network-path issue,
      # or a problem with the probe location itself. Worth a look, not a page.
      - alert: TargetDownInSomeRegions
        expr: |
          (pulsewatch_up == 0)
            and on (target) (max by (target) (pulsewatch_up) == 1)
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.target }} is down from {{ $labels.region }} but up elsewhere"
      - alert: TargetSlow
        expr: pulsewatch:latency_p95_seconds > 2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.target }} p95 latency above 2s from {{ $labels.region }}"
      # Meta-monitoring: who watches the probes. TargetDown is a consensus of the regions
      # that report, so a dead agent doesn't page by itself: it silently shrinks the
      # consensus, and if every agent dies there is no pulsewatch_up left and nothing
      # can fire at all. These two alerts close that gap.
      #
      # A region that reported in the last hour and has no series now: the agent is gone,
      # crashlooping or unscrapable (a failed scrape marks its series stale). A region
      # that has been gone for an hour counts as decommissioned and the alert resolves.
      - alert: ProbeRegionMissing
        expr: |
          group by (region) (max_over_time(pulsewatch_up[1h]))
            unless group by (region) (pulsewatch_up)
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Probe region {{ $labels.region }} stopped reporting; alerts rely on the remaining regions"
      # No agent reports anything: Pulsewatch is blind and TargetDown can never fire.
      - alert: ProbeAgentsAbsent
        expr: absent(pulsewatch_up)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No Pulsewatch probe agent is reporting; uptime alerting is blind"
      # Alertmanager could not deliver to a receiver (a wrong Telegram token or chat id,
      # the alert sink down). Without this, broken routing is silent until a real outage.
      - alert: AlertmanagerNotificationsFailing
        expr: sum by (integration) (rate(alertmanager_notifications_failed_total[5m])) > 0
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Alertmanager is failing to deliver {{ $labels.integration }} notifications"
      # Error budget burn. Each alert needs a long window (enough budget actually spent) and a
      # short one (still burning now, so it resolves soon after recovery).
      #
      # Fast burn is for what TargetDown can't see: a target that flaps or fails some probes
      # and never stays down for 2 minutes. A hard outage already pages as TargetDown, and the
      # 5m window keeps burning for a few minutes after it ends, so fast burn stays quiet for
      # 10m after TargetDown last fired. Otherwise every recovery would page a second time.
      - alert: ErrorBudgetBurnFast
        expr: |
          (
            pulsewatch:slo_error_ratio:1h > 14.4 * (1 - pulsewatch:slo_objective)
              and pulsewatch:slo_error_ratio:5m > 14.4 * (1 - pulsewatch:slo_objective)
          )
          unless on (target)
            max_over_time(ALERTS{alertname="TargetDown", alertstate="firing"}[10m])
        # Longer than TargetDown's 2m, so a hard outage always reaches TargetDown first.
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.target }} is burning its 7d error budget 14x too fast (1h)"
      # Slow burn is a warning, and it may still fire after a long outage has ended: by then
      # the outage really has used a large part of the week's budget.
      - alert: ErrorBudgetBurnSlow
        expr: |
          (
            pulsewatch:slo_error_ratio:6h > 6 * (1 - pulsewatch:slo_objective)
              and pulsewatch:slo_error_ratio:30m > 6 * (1 - pulsewatch:slo_objective)
          )
          or
          (
            pulsewatch:slo_error_ratio:3d > 1 * (1 - pulsewatch:slo_objective)
              and pulsewatch:slo_error_ratio:6h > 1 * (1 - pulsewatch:slo_objective)
          )
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.target }} will run out of its 7d error budget at this rate"
