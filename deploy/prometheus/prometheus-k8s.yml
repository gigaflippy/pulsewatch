# In-cluster Prometheus config (Kubernetes). docker compose uses prometheus.yml instead.
# Discovers every Pulsewatch pod in any namespace (one namespace per region), so adding a
# region needs no change here. The region label comes from the metrics themselves.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

# Alertmanager runs next to Prometheus in both runtimes (compose service / k8s Service).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pulsewatch
    kubernetes_sd_configs:
      - role: pod
        selectors:
          - role: pod
            label: app.kubernetes.io/name=pulsewatch
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+);(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # Alertmanager's own metrics: AlertmanagerNotificationsFailing watches delivery.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
