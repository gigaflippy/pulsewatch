apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pulsewatch-eu
resources:
  - namespace.yaml
  - ../../../base

# Default-deny NetworkPolicy for this namespace; the allow rules live with the workloads.
components:
  - ../../../components/default-deny
images:
  - name: pulsewatch
    newName: pulsewatch
    newTag: dev
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pulsewatch
      spec:
        template:
          spec:
            containers:
              - name: pulsewatch
                env:
                  - name: PULSEWATCH_REGION
                    value: eu-sim
