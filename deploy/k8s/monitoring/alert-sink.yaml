# Local inbox for Alertmanager notifications (pulsewatch-alertsink, from the Pulsewatch
# image). Every receiver delivers here, so routing is visible and testable with no account:
#   kubectl -n pulsewatch port-forward svc/alert-sink 9095:9095
#   curl localhost:9095/notifications
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  labels:
    app.kubernetes.io/name: alert-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-sink
    spec:
      automountServiceAccountToken: false
      # No Docker-link style env vars: the "pulsewatch" Service would inject
      # PULSEWATCH_PORT=tcp://... and collide with the app's PULSEWATCH_* settings.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-sink
          image: pulsewatch
          imagePullPolicy: IfNotPresent
          command: ["pulsewatch-alertsink"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 9095
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  labels:
    app.kubernetes.io/name: alert-sink
spec:
  selector:
    app.kubernetes.io/name: alert-sink
  ports:
    - name: http
      port: 9095
      targetPort: http
