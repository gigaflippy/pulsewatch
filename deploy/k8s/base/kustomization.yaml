# Pulsewatch app: Deployment, Service, PVC, NetworkPolicy and the targets ConfigMap.
# Namespace-agnostic; overlays set the namespace and image tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: pulsewatch
    includeSelectors: false

resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - networkpolicy.yaml

configMapGenerator:
  # Hash-suffixed name, so editing targets.yaml rolls the Deployment automatically.
  - name: pulsewatch-targets
    files:
      - targets.yaml
