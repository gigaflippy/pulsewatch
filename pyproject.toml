[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulsewatch"
version = "0.1.0"
description = "Distributed uptime and latency monitor with Prometheus metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.17.3",
]

[project.scripts]
pulsewatch = "pulsewatch.main:run"
pulsewatch-alertsink = "pulsewatch.alertsink:run"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
