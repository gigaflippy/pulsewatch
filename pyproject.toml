[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulsewatch"
version = "0.1.0"
description = "Distributed uptime and latency monitor with Prometheus metrics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0",
]

[project.scripts]
pulsewatch = "pulsewatch.main:run"
pulsewatch-alertsink = "pulsewatch.alertsink:run"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
files = ["src", "scripts", "tests"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Tests: every function body is checked, but fixtures and helpers may stay unannotated.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["pulsewatch"]
# Two lines that only re-export main.run for `python -m pulsewatch`.
omit = ["*/pulsewatch/__main__.py"]

[tool.coverage.report]
# CI runs `pytest --cov=pulsewatch` and fails below this. Entry points that only hand
# off to uvicorn/ThreadingHTTPServer are excluded; everything else counts.
fail_under = 95
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
